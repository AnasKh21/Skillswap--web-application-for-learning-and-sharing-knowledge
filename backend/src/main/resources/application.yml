server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillswap}
    username: ${DB_USER:skillswap}
    password: ${DB_PASSWORD:skillswap}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schéma, Hibernate valide seulement
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── JWT ──────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:S3cr3tSkillSwapKeyMustBeAtLeast256BitsLongForHS256Algorithm!}
    expiration-ms: 3600000         # 1 h (use 900000 = 15 min in production)
    refresh-expiration-ms: 604800000  # 7 jours

  # ── Upload S3 ─────────────────────────────────────────────────────────────
  media:
    s3:
      bucket-name: ${AWS_S3_BUCKET:user-medias-bucket-sr-001}
      region: ${AWS_S3_REGION:eu-north-1}

  # ── Matching weights (somme = 1.0) ─────────────────────────────────────────
  matching:
    weights:
      bilateral: 0.50             # chacun offre ce que l'autre cherche
      common-skills: 0.20         # nombre de compétences en commun dans l'échange
      reputation: 0.20            # note moyenne de la cible
      recent-activity: 0.10       # lastLogin récent
    activity-threshold-days: 30   # au-delà, pénalité activité
    page-size: 20                 # nombre max de résultats renvoyés par /api/matches

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.skillswap: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
