server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Route all requests to index.html so React Router handles client-side navigation.
    # Without this, a direct visit to /discover would return 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Vite fingerprints filenames on each build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
